<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CheqPay Admin — offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
             font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f9fafb; color: #111827; }
      main { max-width: 22rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-size: 1.25rem; margin: 1rem 0 0.5rem; }
      p { color: #6b7280; font-size: 0.95rem; line-height: 1.5; margin: 0 0 1.5rem; }
      button { border: 0; border-radius: 0.5rem; background: #5e4f85; color: #fff; font-weight: 600;
               padding: 0.7rem 1.4rem; font-size: 0.95rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>The admin dashboard needs a connection. Check your internet and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
