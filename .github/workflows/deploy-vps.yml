name: Deploy API to VPS

# Builds the API image and rolls it out to a self-managed VPS.
#
# MANUAL ONLY, deliberately. While the API still serves from Vercel this must
# not fire on push, or two hosts would race to be the live backend. Change the
# trigger to `push: branches: [main]` as the last step of the cutover, once the
# VPS is confirmed serving (see apps/api/VPS.md).
#
# Required repository secrets:
#   VPS_HOST         hostname or IP of the server
#   VPS_USER         SSH user (needs docker permissions)
#   VPS_SSH_KEY      private key, PEM format, no passphrase
#   VPS_SSH_PORT     optional, defaults to 22
#
# GITHUB_TOKEN pushes to GHCR; no extra registry credentials needed here. The
# server needs its own read-only pull credential — see the runbook.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build and deploy"
        required: false
        default: main

concurrency:
  group: vps-api-deploy
  cancel-in-progress: false # never interrupt a rollout mid-flight

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cheqpay-api

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve immutable tag
        id: meta
        # The commit SHA, never "latest": a deploy must name exactly one build,
        # and a rollback must be able to name the one before it.
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          # Layer cache in the registry: without it every run repeats the full
          # bun install + prisma generate + next build.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Roll out over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          # deploy.sh waits for the health check and exits non-zero if the new
          # image never becomes healthy, which fails this step and leaves the
          # previous container serving.
          script: IMAGE_TAG=${{ needs.build.outputs.tag }} /opt/cheqpay/deploy.sh
