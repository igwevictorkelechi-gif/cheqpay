<title>Sign in to CheqPay</title>

<body style="margin:0;padding:0;background-color:#F4F3F8;">
  <!-- Preheader: the grey line an inbox shows after the subject. Hidden in the

  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Use the link below to sign in. It works once and expires shortly.</div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#F4F3F8;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="width:100%;max-width:560px;background-color:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #E4E2EC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
          <tr>
            <td style="padding:18px 28px 0;">
              <span style="color:#1F1B29;font-size:17px;font-weight:800;letter-spacing:-0.3px;">CheqPay</span>
            </td>
          </tr>
          
    <tr>
      <td style="background-color:#EEEEF4;padding:24px 28px;border-bottom:3px solid #3F3D56;">
        <div style="color:#3F3D56;font-size:12px;font-weight:800;letter-spacing:0.1em;text-transform:uppercase;">
          <span style="font-size:15px;">&#9782;</span>&nbsp;Statement
        </div>
        <div style="margin-top:6px;color:#1F1B29;font-size:21px;font-weight:800;line-height:27px;">Sign in to CheqPay</div>
      </td>
    </tr>
          <tr>
            <td style="padding:22px 28px 26px;">
              <p style="margin:0;color:#1F1B29;font-size:15px;line-height:23px;">Use the link below to sign in. It works once and expires shortly.</p>
              
              
              
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-top:22px;">
      <tr>
        <td style="background-color:#3F3D56;border-radius:999px;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 28px;color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;">Sign in</a>
        </td>
      </tr>
    </table>
